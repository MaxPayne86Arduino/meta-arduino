name: Nightly Build Dispatcher (wrynose)

on:
  workflow_dispatch:
  schedule:
    # At 23:22 UTC every day (staggered 1 hour before master's nightly at 0:22 UTC)
    - cron: "22 23 * * *"

permissions:
  contents: read

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Nightly Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run --repo "${GITHUB_REPOSITORY}" --ref wrynose nightly-build.yml
