#@TYPE: Machine
#@NAME: Arduino Monza (VentUNO Q)
#@SOC: Qualcomm IQ-8275
#@DESCRIPTION: Machine configuration for Arduino Monza (VentUNO Q) board based on Qualcomm IQ-8275 SoC and STM32 microcontroller.
#@MAINTAINER: Massimo Pennazio <maxipenna@libero.it>

require conf/machine/ventuno-q.conf

MACHINEOVERRIDES =. "ventuno-q:"

# Override the variables you want to change here
KERNEL_CMDLINE_EXTRA:append = "${@bb.utils.contains('PREFERRED_KERNEL', 'linux-qcom-next-rt', ' isolcpus=2,3 nohz_full=2,3 rcu_nocbs=2,3 irqaffinity=0-1 rcupdate.rcu_expedited=1 cpuidle.off=1', '', d)}"

# Disable PCIe ASPM (L0s/L1) link power states. The downstream PCIe switch port
# feeding the M.2 WiFi/BT module (ath11k) floods dmesg with correctable "RxErr"
# (Physical Layer, Receiver ID) AER events under ASPM, and these occasionally
# escalate into an Uncorrectable Non-Fatal "UnsupReq" error on the root port
# (0000:00:00.0, [17cb:0115]) that the ath11k_pci/xhci_hcd drivers cannot
# recover from (they have no AER error_detected callback), hurting WiFi/USB
# link stability and throughput. Forcing the "performance" policy keeps the
# link in L0 and avoids the retrain-induced errors.
KERNEL_CMDLINE_EXTRA:append = " pcie_aspm.policy=performance"

# Arduino core configuration
ARDUINO_CORE_VERSION ?= "1.0.0"
ARDUINO_CORE ?= "arduino:zephyr@${ARDUINO_CORE_VERSION}"
ARDUINO_ZEPHYR_LOADER ?= "zephyr-arduino_ventuno_q_stm32h5f5xx"
# The sketch to be flashed on the board. You can change this to point to your own sketch. Path is relative to the arduino-core directory.
ARDUINO_SKETCH ?= "Reflash_Bootanimation.ino"
ARDUINO_SKETCH_PATH ?= "libraries/Arduino_LED_Matrix/examples/Reflash_Bootanimation/${ARDUINO_SKETCH}"
# Dependencies for the Sketch. You can add more dependencies here if your sketch requires them.
ARDUINO_SKETCH_LIBS ?= "ArduinoGraphics Arduino_RouterBridge"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "arduino-default-firmware"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "arduino-router"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-modules"
