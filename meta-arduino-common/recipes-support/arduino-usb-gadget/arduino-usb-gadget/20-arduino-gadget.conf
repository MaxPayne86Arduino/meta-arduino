# Arduino owns the USB gadget composition: adbd must not build/tear down its own
# single-function 'adb' gadget (see android-tools-conf 10-adbd-configfs.conf),
# it only has to attach to the ffs.adb instance created by usb-gadget.service.
[Unit]
Requires=usb-gadget.service
After=usb-gadget.service

[Service]
ExecStartPre=
ExecStartPost=
ExecStopPost=
